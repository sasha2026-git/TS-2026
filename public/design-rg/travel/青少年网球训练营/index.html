<script>
(() => {
  const root = document.documentElement;
  const header = document.querySelector('.site-header');
  const menuButton = document.querySelector('.menu-toggle');
  const nav = document.getElementById('main-nav');
  if (!header || !menuButton || !nav) return;
  root.classList.add('js');
  const readLang = () => { try { return localStorage.getItem('tp-lang'); } catch { return null; } };
  const saveLang = (lang) => { try { localStorage.setItem('tp-lang', lang); } catch {} };
  const applyLang = (lang) => {
    const next = lang === 'en' ? 'en' : 'zh';
    root.dataset.lang = next;
    root.lang = next === 'zh' ? 'zh-CN' : 'en';
    document.querySelectorAll('[data-zh][data-en]').forEach((node) => {
      const value = node.dataset[next];
      if (value) node.textContent = value;
    });
    document.querySelectorAll('[data-aria-zh]').forEach((node) => {
      node.setAttribute('aria-label', next === 'zh' ? node.dataset.ariaZh : node.dataset.ariaEn);
    });
    document.querySelectorAll('.lang-btn').forEach((button) => {
      const active = button.dataset.setLang === next;
      button.classList.toggle('is-active', active);
      button.setAttribute('aria-pressed', String(active));
    });
    saveLang(next);
  };
  document.querySelectorAll('.lang-btn').forEach((button) => {
    button.addEventListener('click', () => applyLang(button.dataset.setLang));
  });
  applyLang(readLang() || root.dataset.lang || 'zh');
  const closeMenu = () => { document.body.classList.remove('nav-open'); menuButton.setAttribute('aria-expanded', 'false'); };
  menuButton.addEventListener('click', () => {
    const open = document.body.classList.toggle('nav-open');
    menuButton.setAttribute('aria-expanded', String(open));
  });
  nav.querySelectorAll('a').forEach((link) => link.addEventListener('click', closeMenu));
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeMenu(); });
  const onScroll = () => header.classList.toggle('is-scrolled', window.scrollY > 8);
  onScroll(); window.addEventListener('scroll', onScroll, { passive: true });
})();
</script>
